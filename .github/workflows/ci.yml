name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go mod download
      - run: npm run test:go
      - run: npm run build
      - run: npm test
      - run: npm run test:wasm
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-bundle-npm-package
          path: '*.tgz'
